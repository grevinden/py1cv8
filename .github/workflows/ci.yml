name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src/py1cv8/
      - run: mypy src/py1cv8/

  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ODBC Driver (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell -Command "
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2294593&clcid=0x409' -OutFile msodbcsql.msi;
            Start-Process msiexec -ArgumentList '/i msodbcsql.msi /quiet IAcceptLicenseTerms=Yes' -NoNewWindow -Wait;
            Remove-Item msodbcsql.msi;
          "
        shell: pwsh
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Debug info
        run: |
          pip list
          python --version
          pytest --version
      - name: Run tests
        run: pytest tests/ -v --tb=short -x
