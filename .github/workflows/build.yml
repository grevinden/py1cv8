name: Build

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: py1cv8-win-x64.exe
            nuitka-opts: >
              --onefile --output-dir=dist
              --output-filename=py1cv8-win-x64.exe
              --python-flag="-m" --prefer-source-code
              --nofollow-import-to=mypy
              --include-module=psycopg2
              --include-module=sqlalchemy.dialects.postgresql
              --include-module=pyodbc
              --include-module=charset_normalizer
              --include-windows-runtime-dlls=yes
              src/py1cv8
          - os: ubuntu-24.04
            artifact: py1cv8-linux-x64
            nuitka-opts: >
              --onefile --output-dir=dist
              --output-filename=py1cv8-linux-x64
              --python-flag="-m" --prefer-source-code
              --nofollow-import-to=mypy
              --include-module=psycopg2
              --include-module=sqlalchemy.dialects.postgresql
              --include-windows-runtime-dlls=no
              src/py1cv8
          - os: macos-latest
            artifact: py1cv8-mac-x64
            nuitka-opts: >
              --onefile --output-dir=dist
              --output-filename=py1cv8-mac-x64
              --python-flag="-m" --prefer-source-code
              --nofollow-import-to=mypy
              --include-module=psycopg2
              --include-module=sqlalchemy.dialects.postgresql
              --include-windows-runtime-dlls=no
              src/py1cv8

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install -e .
      - name: Build with Nuitka
        run: python -m nuitka ${{ matrix.nuitka-opts }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            py1cv8-win-x64.exe/py1cv8-win-x64.exe
            py1cv8-linux-x64/py1cv8-linux-x64
            py1cv8-mac-x64/py1cv8-mac-x64
          prerelease: true
          generate_release_notes: true
