[project]
name = "py1cv8"
version = "0.1.0"
description = "MCP-сервер для прямого SQL-доступа к базам 1С (PostgreSQL) с пониманием метаданных"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "chardet>=5.2",
    "asyncpg>=0.31",
    "mcp>=1.27",
]

[project.scripts]
py1cv8 = "py1cv8.__main__:main"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
strict = false
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "psycopg2"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "chardet"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
